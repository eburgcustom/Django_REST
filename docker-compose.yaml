version: '3.9'

services:
  # PostgreSQL база данных
  db:
    image: postgres:16
    container_name: django_rest_db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis для Celery и кэша
  redis:
    image: redis
    container_name: django_rest_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django бэкенд
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_rest_backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_HOST=db
      - CELERY_BROKER_URL=${CELERY_BROKER_URL_DOCKER}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND_DOCKER}

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_rest_celery_worker
    command: celery -A config worker -l info --pool=eventlet
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_HOST=db
      - CELERY_BROKER_URL=${CELERY_BROKER_URL_DOCKER}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND_DOCKER}

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_rest_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_HOST=db
      - CELERY_BROKER_URL=${CELERY_BROKER_URL_DOCKER}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND_DOCKER}

volumes:
  postgres_data:
  redis_data:
